<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Groot</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #09090b; color: #e4e4e7; font: 13px/1.3 -apple-system, "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 12px; height: 100%; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); box-sizing: border-box; }
  .orb { width: 26px; height: 26px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 35%, #ff8a8a, #ff3636 55%, #7a0b0b); box-shadow: 0 0 14px rgba(255,54,54,0.55); }
  .bar.wait .orb { background: radial-gradient(circle at 35% 35%, #ffe08a, #f5b400 55%, #6b4a00); box-shadow: 0 0 14px rgba(245,180,0,0.55); }
  .bar.done .orb { background: radial-gradient(circle at 35% 35%, #9ef0b5, #22c55e 55%, #0b5223); box-shadow: 0 0 14px rgba(34,197,94,0.5); }
  .bar.bad .orb { background: #52525b; box-shadow: none; }
  .text { flex: 1; min-width: 0; }
  .title { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line { color: #a1a1aa; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar.wait .line { color: #fcd34d; }
  button { height: 34px; padding: 0 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); color: #fafafa; font: inherit; font-weight: 700; cursor: pointer; }
  button.stop { background: #ff3636; border-color: #ff3636; }
  button[hidden] { display: none; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="orb" aria-hidden="true"></div>
  <div class="text">
    <div class="title" id="title">Groot</div>
    <div class="line" id="line">Getting ready</div>
  </div>
  <button id="next" hidden>Done, next video</button>
  <button id="stop" class="stop">Stop</button>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  $("stop").addEventListener("click", () => window.grootBar.stop());
  $("next").addEventListener("click", () => window.grootBar.next());
  window.grootBar.onStatus((s) => {
    if (!s || typeof s !== "object") return;
    $("title").textContent = String(s.title || "Groot");
    $("line").textContent = String(s.line || "");
    const st = String(s.status || "posting");
    $("bar").className = "bar" + (st === "needs_you" || st === "ready" ? " wait" : st === "posted" ? " done" : st === "failed" || st === "stopped" ? " bad" : "");
    $("next").hidden = st !== "ready";
    $("stop").hidden = st === "posted" || st === "failed" || st === "stopped";
  });
</script>
</body>
</html>
